<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rock, Paper, Scissors</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header: game title and short instruction -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <main>
        <!-- Player section: name input and Start Game button -->
        <section id="player">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button onclick="startGame()">Start Game</button>
            <p id="welcome"></p>
        </section>

        <!-- Game section: choice buttons and the two images -->
        <section id="game">
            <div class="choices">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>
            <div class="arena">
                <div class="side">
                    <h3>You</h3>
                    <img id="playerImg" src="rock.png" alt="Your choice">
                </div>
                <div class="vs">VS</div>
                <div class="side">
                    <h3>Computer</h3>
                    <img id="computerImg" src="rock.png" alt="Computer's choice">
                </div>
            </div>
        </section>

        <!-- Result section: result message and scoreboard -->
        <section id="resultSection">
            <p id="result"></p>
            <p class="scoreboard">
                Wins: <span id="wins">0</span>
                Losses: <span id="losses">0</span>
                Draws: <span id="draws">0</span>
            </p>
        </section>

        <!-- History section: one row per round -->
        <section id="historySection">
            <h2>History</h2>
            <table id="history">
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </table>
            <div class="actions">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="summary"></p>
        </section>
    </main>

    <!-- Footer: start time and copyright -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- External JavaScript (placed before the closing body tag) -->
    <script src="game.js"></script>
</body>
</html>
