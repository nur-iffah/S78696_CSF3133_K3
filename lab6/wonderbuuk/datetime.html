<!DOCTYPE html>
<html>
<head>
    <title>Date and Time</title>
</head>
<body>
    <button type="button" onclick="document.getElementById('demo').innerText = Date()">Click me to display Date and Time</button>
    <p id="demo"></p>

    <!-- Step 2: change the style of the paragraph (demo) -->
    <script>
        document.getElementById("demo").style.color = "red";
        document.getElementById("demo").style.backgroundColor = "yellow";
    </script>
</body>
</html>
