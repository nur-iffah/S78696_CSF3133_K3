<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grade Calculator</title>
<!-- Part 2: link the CSS file -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Student Grade Calculator</h2>
<!-- Fixed: "return checkMark()" so that returning false stops the form from submitting -->
<form name="gradeForm" onsubmit="return checkMark()">
<label for="name">Name:</label>
<input type="text" id="name" name="name"><br>
<label for="mark">Mark (0-100):</label>
<input type="text" id="mark" name="mark"><br>
<button type="submit">Check Grade</button>
<!-- Part 2: Random Mark button (type="button" so it does not submit the form) -->
<button type="button" onclick="randomMark()">Random Mark</button>
</form>
<p id="result"></p>
<!-- Part 2: date and time of checking -->
<p id="checkedOn"></p>
<!-- Fixed: showTable() (capital T) -->
<button onclick="showTable()">Show Grade Table</button>
<div id="tableContainer"></div>
<!-- Fixed: grade.js (not grades.js) -->
<script src="grade.js"></script>
</body>
</html>
