<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interactive Contact Form</title>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <h1>Contact Us</h1>
    <span>We'd love to hear from you — reach out anytime!</span>
  </div>

  <!-- Content Section -->
  <div id="content">
    <h2>Send an Inquiry</h2>
    <form action="">
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" placeholder="you@example.com" required><br><br>

      <label for="contact-date">Preferred Contact Date:</label><br>
      <input type="date" id="contact-date" name="contactDate"><br><br>

      <label for="satisfaction">Satisfaction Level (1–10):</label><br>
      <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5"><br><br>

      <input type="submit" value="Submit">
    </form>

    <!-- Inline Calculator Div -->
    <div id="calculator">
      <h3>Quick Inline Calculator</h3>
      <form oninput="result.value = parseInt(num1.value || 0) + parseInt(num2.value || 0)">
        <input type="number" id="num1" value="0"> +
        <input type="number" id="num2" value="0"> =
        <output name="result" for="num1 num2">0</output>
      </form>
    </div>
  </div>

  <!-- Footer Section -->
  <div id="footer">
    <p>Contact: support@example.com | &copy; 2026 My Website. All rights reserved.</p>
  </div>

</body>
</html>
